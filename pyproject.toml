[project]
name = "hermes-inworld"
version = "1.4.0"
description = "Hermes Agent plugin providing Inworld TTS-2 (steered speech synthesis) and Realtime STT (transcription with Voice Profile analysis)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruamel-yaml>=0.18.16",
]

[dependency-groups]
dev = [
    "hermes-agent",
    "ruff>=0.15.22",
]

[tool.uv.sources]
hermes-agent = { git = "https://github.com/NousResearch/hermes-agent.git" }
